client:
    type: open
    rate: 1000
    # Per-protocol max_undone (uniform-yml rule, set 2026-05-05; revised 2026-05-06).
    # MongoDB backend ceiling = 1.72k r/s (YCSB workload A + custom PyMongo
    # bench, both within 0.5 %; see results/2026-05-05-camera-ready-exp0-fixes-v2/
    # backend_microbench/). With 60 client coros across 10 hosts the
    # cluster cap = 60×50 = 3 000 r/s ≈ 1.7× headroom over the 1.72k
    # backend ceiling — exposes the bottleneck cleanly without forcing
    # tens-of-seconds sat latency. Earlier 2000 was a deep-probe override
    # (120k cap → ~70 s sat latency); retired now that the backend
    # ceiling is firmly measured.
    max_undone: 50
