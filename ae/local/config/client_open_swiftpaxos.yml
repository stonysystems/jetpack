client:
    type: open
    rate: 1000
    # Per-protocol max_undone (uniform-yml rule, set 2026-05-05).
    # Sizing: aggregate offered tput = 60 × min(c, max_undone). Sized to the
    # protocol's expected sat tput with ~1.5–2× headroom.
    # SwiftPaxos: ~12k r/s sat with extra headroom → 60×500 = 30k cluster cap
    # (server may exceed 12k; CPU only ~68 % at c=1500 in 2026-05-02 data).
    max_undone: 500
