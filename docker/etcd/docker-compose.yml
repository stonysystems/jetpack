# Docker Compose for Jetpack + etcd integration testing.
#
# Usage:
#   # Build the image first:
#   docker compose -f docker/etcd/docker-compose.yml build
#
#   # Single-process test (etcd + Jetpack in one container):
#   docker compose -f docker/etcd/docker-compose.yml run --rm jetpack-etcd single
#
#   # Multi-process test (separate etcd cluster + Jetpack nodes):
#   docker compose -f docker/etcd/docker-compose.yml up etcd
#   # Then in another terminal:
#   docker compose -f docker/etcd/docker-compose.yml run --rm jetpack-etcd multi
#
#   # Cleanup:
#   docker compose -f docker/etcd/docker-compose.yml down -v

services:
  # Standalone etcd server for external-mode testing
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --data-dir=/etcd-data
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jetpack with etcd integration
  jetpack-etcd:
    build:
      context: ../..
      dockerfile: docker/etcd/Dockerfile
    privileged: true
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
    volumes:
      - ../../config:/jetpack/config:ro
