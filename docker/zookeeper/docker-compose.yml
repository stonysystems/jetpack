# Docker Compose for Jetpack + ZooKeeper integration testing.
#
# Usage:
#   # Build the image first:
#   docker compose -f docker/zookeeper/docker-compose.yml build
#
#   # Single-process test (ZooKeeper + Jetpack in one container):
#   docker compose -f docker/zookeeper/docker-compose.yml run --rm jetpack-zookeeper single
#
#   # ZooKeeper only (start embedded ZooKeeper server):
#   docker compose -f docker/zookeeper/docker-compose.yml up zookeeper
#   # Then in another terminal:
#   docker compose -f docker/zookeeper/docker-compose.yml run --rm jetpack-zookeeper zookeeper-only
#
#   # Cleanup:
#   docker compose -f docker/zookeeper/docker-compose.yml down -v

services:
  # Standalone ZooKeeper server for external-mode testing
  zookeeper:
    image: zookeeper:3.9
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jetpack with ZooKeeper integration
  jetpack-zookeeper:
    build:
      context: ../..
      dockerfile: docker/zookeeper/Dockerfile
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      - ZOOKEEPER_ENDPOINTS=127.0.0.1:2181
    volumes:
      - ../../config:/jetpack/config:ro
