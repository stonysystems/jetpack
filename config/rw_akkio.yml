
# Akkio-style latency workload:
#   - uniform key distribution (zipf with coefficient 0 => uniform)
#   - 1,000,000-key population (same as rw_zipf_0.yml)
#   - 50/50 read/write mix (differs from rw_zipf_0.yml which is write-only)
#
# Used by scripts/run_akkio_etcd.sh for the 4-variant latency A/B.

bench:
  workload: rw
  scale: 1
  weight:
    read: 1
    write: 1
  population: # initial number of records in each table
    history: 1000000
  range: 1000000
  dist: zipf
  coefficient: 0

schema: # table information
  - name: history
    column:
      - {name: h_key,     type: integer, primary: true}
      - {name: h_c_id,    type: integer}

# sharding strategy.
# default is MOD by primary key.
# CUSTOM means strategy is defined in the code.
sharding:
  history:    MOD
