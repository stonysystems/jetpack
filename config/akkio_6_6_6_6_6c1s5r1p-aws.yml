# Akkio client layout (compact): 6/6/6/6/6 sites on server0..server4 (total 30).
#
# Distribution share is encoded NOT in this site map (which is fixed) but in
# per-DC client concurrency via concurrent_z{0..4}.yml + client_open_z{0..4}.yml,
# regenerated per cell by rerun_6sites_akkio.sh.
#
# Why fixed 6 sites/DC: with the prior 100-site map, 100% of the load on
# server0 (d5) caused server0 to spend ~3 minutes serially calling
# CreateCommo for each client site, which exceeded the cross-region
# connect timeout and crashed the binary. Capping at 6 sites/host bounds
# init time at ~6-12 s regardless of the load distribution.

site:
  server: # each line is a partition, the first is the master site_name:port
    - ["s101:38000", "s201:38001", "s301:38002", "s401:38003", "s501:38004"]
  client: # each line is a partition; 30 clients total (6 per DC)
    - ["c001", "c002", "c003", "c004", "c005", "c006",
       "c007", "c008", "c009", "c010", "c011", "c012",
       "c013", "c014", "c015", "c016", "c017", "c018",
       "c019", "c020", "c021", "c022", "c023", "c024",
       "c025", "c026", "c027", "c028", "c029", "c030"]

process:
  s101: server0
  s201: server1
  s301: server2
  s401: server3
  s501: server4
  c001: server0
  c002: server0
  c003: server0
  c004: server0
  c005: server0
  c006: server0
  c007: server1
