mode:
  cc: none  # concurrency control: classic dispatch, no 2PC, no Jetpack
  ab: raft  # atomic broadcast: Raft replication for writes
  batch: false
  retry: 20
  ongoing: 1  # per client
  # Read-lease optimization: when the partition leader holds a valid
  # lease (extended every successful AppendEntries quorum round, with
  # warm-up at leader-election), single-key read pieces are served
  # directly from the leader's local state machine — skipping the
  # Raft replication round-trip. Lease miss falls back to the standard
  # replicated path silently. Linearizable as long as the lease
  # duration stays bounded below the minimum follower election timeout
  # minus a clock-skew safety budget (see RaftServer::kReadLeaseDurationUs).
  raft_read_lease: true
