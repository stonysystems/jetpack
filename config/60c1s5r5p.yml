
# 60 clients, 1 site, 5 replicas, 5 processes — multi-process Docker benchmark.
#
# Each server is mapped to a separate loopback address (127.0.0.1 - 127.0.0.5)
# so that tc/netem can apply per-server latency to simulate network delays.
# 12 clients co-located per process (60 total client threads).

site:
  server: # each line is a partition, the first is the master site_name:port
    - ["s101:18000", "s201:18001", "s301:18002", "s401:18003", "s501:18004"]
  client: # each line is a partition
    - ["c01", "c02", "c03", "c04", "c05", "c06", "c07", "c08", "c09", "c10",
       "c11", "c12", "c13", "c14", "c15", "c16", "c17", "c18", "c19", "c20",
       "c21", "c22", "c23", "c24", "c25", "c26", "c27", "c28", "c29", "c30",
       "c31", "c32", "c33", "c34", "c35", "c36", "c37", "c38", "c39", "c40",
       "c41", "c42", "c43", "c44", "c45", "c46", "c47", "c48", "c49", "c50",
       "c51", "c52", "c53", "c54", "c55", "c56", "c57", "c58", "c59", "c60"]

process:
  s101: h1
  s201: h2
  s301: h3
  s401: h4
  s501: h5
  c01: h1
  c02: h1
  c03: h1
