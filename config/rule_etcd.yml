mode:
  cc: rule # concurrency control
  ab: etcd # atomic broadcast
  # read_only: occ
  batch: false
  retry: 20
  ongoing: 1 # per client
  # Jetpack is assumed to always run with the fused leader RPC optimization
  # going forward (see
  # docs/2026-04-22_jp-raft-fp100_merge-rpc-and-pool-opts_ab.md for the A/B
  # result on jp-raft that motivated making this the default).
  jetpack_merge_leader_rpc: true
