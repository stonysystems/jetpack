client:
    type: open
    rate: 1000
    # Per-protocol max_undone (uniform-yml rule, set 2026-05-05).
    # User override: mongodb sat tput ≈ 1.25k r/s (writeConcern:majority+j is
    # slow). Default sizing (~1 s sat latency target) would pick max_undone
    # ≈ 20. Setting 2000 instead intentionally probes whether mongodb can
    # scale past the apparent 1.25k ceiling under deeper pipelining /
    # other timing knobs. Cluster cap = 60×2000 = 120k. If sat tput
    # really is 1.25k, sat latency is ~96 s — accepted tradeoff.
    max_undone: 2000
