client:
    type: open
    rate: 1000
    # max_undone sizing (Little's Law): N ~= throughput (req/s) * latency (s)
    #   Raft   : 11k req/s * 0.5s  ~= 5500
    #   Copilot:  5k req/s * 0.55s ~= 2750
    #   Mencius: 2.5k req/s * 0.4s ~= 1000
    #   MongoDB:  4k req/s * 0.5s  ~= 2000
    # Rule of thumb -> max_undone >= 1.5-2x max(lambda_i * L_i) => ~8k-10k globally.
    # Per-worker cap (with 60 workers/site). The first camera-ready small-test
    # iteration showed every Group-A protocol plateauing at ~6k req/s before
    # leader CPU at 100%. Root cause was n_concurrent × per-coro 0.5 req/s
    # (client_worker.cc:450) capping aggregate attempts below the actual leader
    # capacity. Bumped to 5000 alongside higher conc points (500/750/1000) so
    # 60 × 5000 = 300k in-flight cap is well above any realistic leader
    # ceiling — and so per-worker max_undone never binds even if every coro
    # has a request outstanding at high latency.
    max_undone: 5000
