client:
    type: open
    rate: 1000
    # max_undone sizing rule: N ≈ peak_throughput × baseline_latency
    # Per-worker cap (60 workers cluster-wide on 60 client sites).
    # Sized from 2026-05-02 observed data with 2× safety margin:
    #   epaxos     @ peak: 30k r/s × 0.181 s / 60 × 2 ≈ 178
    #   zookeeper  @ peak: 30k r/s × 0.132 s / 60 × 2 ≈ 131
    #   swiftpaxos @ peak: 18k r/s × 0.209 s / 60 × 2 ≈ 125
    #   raft       @ peak: 12k r/s × 0.351 s / 60 × 2 ≈ 140
    #   others     @ peak: 60–90
    # Picked 200 to cover all (max needed = 178). Cluster cap = 60 × 200 = 12k
    # outstanding — far above each protocol's working set, but actively caps:
    #   - latency surge past saturation: worst case 12k / sat_tput
    #     (mongo 1.8k → 6.7 s; raft 12k → 1.0 s)  vs. observed 30-60 s+ at max=5000
    #   - post-workload drain time: same bound, 0.4-7 s vs. 30-180 s previously.
    # The previous setting (5000) gave 60×5000 = 300k cluster cap, well above
    # what RPC backpressure naturally throttles to (~5/coro × 1800 coros ≈ 9k
    # active). max_undone=5000 was effectively unbounded; 200 actively bounds
    # queue depth at saturation while leaving steady-state throughput intact.
    max_undone: 200
