mode:
  cc: none        # concurrency control: no distributed tx
  ab: naive_raft  # "atomic broadcast": Raft-shaped leader broadcast, no log
  batch: false
  retry: 20
  ongoing: 1

# naive_raft is a Raft-shaped broadcast without any of the bookkeeping:
#   1. client sends one Dispatch RPC to the fixed leader at locale_id=1
#      (IP .102, displayed as zoo2 in 1-indexed naming)
#   2. leader broadcasts Dispatch to the 4 followers with dep_id.str
#      "nr_replicate" so followers recognize the replication path
#   3. followers execute the R/W command locally and ack unconditionally
#   4. leader counts itself as 1 and waits for 2 follower replies (3/5
#      simple majority), executes locally, then replies to the client
#
# No log, no election, no heartbeats. Baseline for the CPU/latency cost of
# the leader-broadcast + majority-quorum shape without the bookkeeping.
