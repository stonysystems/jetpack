\* Recovery-focused config for jetpack_raft_composition: no clients and
\* no commands, so pools stay empty and Recovered(∅) is the marker; one
\* election. Checks the recovery protocol (view installs, resume, Nack/learn
\* paths) exhaustively.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {}
  CmdId = {}
  Key = {k1}
  InitialMembers = {s1, s2, s3}
  MinClusterSize = 2
  MaxClusterSize = 3
  MaxElections = 1
  MaxRestarts = 0
  MaxAddReconfigs = 0
  MaxRemoveReconfigs = 0
  IncludeThesisBug = FALSE

CONSTRAINT RecoveryStateConstraint

INVARIANT Probe_NoViewInstalled
