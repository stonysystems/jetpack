\* Small config for jetpack_copilot_composition: 3 servers, one client,
\* one command on one key, one pilot change (EmptyViewChange or
\* FastTakeover), no restart. No SYMMETRY: base_copilot picks the initial
\* pilots and ranks servers with CHOOSE over Server.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  MaxPilotChanges = 1
  MaxRestarts = 0

CONSTRAINT SmallStateConstraint

INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecution
  LogOrderMatchesExecutionCopilot
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  TwoPilots
  TermIsViewEpoch
  CommitIndexWithinLog
  Principle2Copilot
  ResumeOnlyAfterOwnRecovered
  OnlyPilotsLead
  EpochDeterminesMembership
