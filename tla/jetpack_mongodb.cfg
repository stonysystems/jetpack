\* Default config for jetpack_mongodb_composition (the pseudocode): 3 servers, two
\* commands on one key, one election, one restart, one (remove) reconfig.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1, id2}
  Key = {k1}
  MaxElections = 1
  MaxRestarts = 1
  MaxReconfigs = 1

CONSTRAINT StateConstraint

INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  NoLogDivergence
  MaxOneReconfigurationAtATime
  ElectionSafety
  Principle2MongoDb
  EpochDeterminesMembership
