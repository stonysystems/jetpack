\* Default config for jetpack_copilot_composition: 4 servers (a fast
\* commit needs 3 of 4 including both pilots), two commands on one key, two
\* pilot changes, one restart. J!LogOrderMatchesExecution is not checked
\* here: with two conflicting commands both pilots propose the same
\* fast-path command (N20) and the per-sequence order of the duplicate
\* occurrence is not an execution constraint; LogOrderMatchesExecutionCopilot
\* is the CoPilot form (see the wrapper).
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3, s4}
  Client = {c1}
  CmdId = {id1, id2}
  Key = {k1}
  MaxPilotChanges = 2
  MaxRestarts = 1

CONSTRAINT StateConstraint

INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecutionCopilot
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  TwoPilots
  TermIsViewEpoch
  CommitIndexWithinLog
  Principle2Copilot
  ResumeOnlyAfterOwnRecovered
  OnlyPilotsLead
  EpochDeterminesMembership
