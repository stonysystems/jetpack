\* Small config for jetpack_raft_composition: 3 servers, one election,
\* no reconfiguration. Exhaustive in minutes.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  InitialMembers = {s1, s2, s3}
  MinClusterSize = 2
  MaxClusterSize = 3
  MaxElections = 1
  MaxRestarts = 0
  MaxAddReconfigs = 0
  MaxRemoveReconfigs = 0
  IncludeThesisBug = FALSE

CONSTRAINT SmallStateConstraint

INVARIANT Probe_NoFastCommitAfterRecovery
