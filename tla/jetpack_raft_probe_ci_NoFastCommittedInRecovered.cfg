\* CI probe for jetpack_raft_composition (.github/workflows/formal.yml):
\* Probe_NoFastCommittedInRecovered is EXPECTED to be violated (TLC exit code
\* 12). The 33-state trace witnesses that a Recovered(S) containing the
\* fast-committed command is submitted (L47) by the new leader while the old
\* leader's proposal of it is still uncommitted: a fast commit of the command,
\* an election, and the recovery's BeginRecovery, Prepare and Accept phases.
\* The commit of that entry is not in the trace; the recovery probes
\* (jetpack_raft_probe_recovery_*.cfg) cover it. Same constants as
\* jetpack_raft_small.cfg; CiProbeConstraint (see the module) bounds the
\* interleavings so that breadth-first search reaches the trace in about a
\* minute.
\*
\* Measured with 2 workers (TLC 2026.10.30.154139, Temurin 21, shared 64-core
\* server): about 1 min (57 s and 1 min 00 s in two runs), about 112,000
\* distinct states explored before the trace (112,225 and 112,254; the count
\* varies slightly with the workers' interleaving), exit code 12; the committed
\* log/*_jetpack_raft_probe_ci_NoFastCommittedInRecovered.log is the transcript
\* of such a run.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  InitialMembers = {s1, s2, s3}
  MinClusterSize = 2
  MaxClusterSize = 3
  MaxElections = 1
  MaxRestarts = 0
  MaxAddReconfigs = 0
  MaxRemoveReconfigs = 0
  IncludeThesisBug = FALSE

CONSTRAINT CiProbeConstraint

INVARIANT Probe_NoFastCommittedInRecovered
