\* Large config for jetpack_raft_composition.
\* Mirrors tla/large.cfg dimensions (Server=5, Client=3, CmdId=3, Key=2)
\* but adds the reconfig constants required by base_raft.tla and drops
\* SYMMETRY (the member set is dynamic, so Permutations(Server) is unsafe).

SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3, s4, s5}
  Client = {c1, c2, c3}
  CmdId = {id1, id2, id3}
  Key = {k1, k2}
  InitialMembers = {s1, s2, s3}
  MinClusterSize = 2
  MaxClusterSize = 4
  MaxElections = 1
  MaxRestarts = 0
  MaxAddReconfigs = 1
  MaxRemoveReconfigs = 1
  IncludeThesisBug = FALSE

CONSTRAINT StateConstraint

PROPERTY Safety
