\* Small config for jetpack_mencius_composition (the pseudocode): 3 servers (one static
\* view, every server a proposer), one command, no restart, no revoke; the
\* command is fast-committed and chosen in every sequence. No SYMMETRY:
\* base_mencius's round-robin order is a CHOOSE over
\* Server, which is not symmetric.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  MaxRestarts = 0
  MaxRevokes = 0

CONSTRAINT SmallStateConstraint

INVARIANTS
  CommittedLogAgreement
  SlotOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  FastCommitDurability
  PoolsConflictFree
  SlotAgreement
  LogMatchesSlots
  StaticView
