\* Probe config for jetpack_mencius_composition: same model as
\* jetpack_mencius_small.cfg, checking Probe_NoFastCommit, which is EXPECTED
\* to be violated (the trace shows a fast commit with every server's ack).
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  MaxRestarts = 0
  MaxRevokes = 0

CONSTRAINT SmallStateConstraint

INVARIANT Probe_NoFastCommit
