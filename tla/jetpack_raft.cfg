\* Default config for jetpack_raft_composition: 3 servers, two commands
\* on one key, one election, one restart, one add + one remove reconfig.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3, s4}
  Client = {c1}
  CmdId = {id1, id2}
  Key = {k1}
  InitialMembers = {s1, s2, s3}
  MinClusterSize = 2
  MaxClusterSize = 4
  MaxElections = 1
  MaxRestarts = 1
  MaxAddReconfigs = 1
  MaxRemoveReconfigs = 1
  IncludeThesisBug = FALSE

CONSTRAINT StateConstraint

INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  NoLogDivergence
  MaxOneReconfigurationAtATime
  ElectionSafety
  Principle2Raft
  EpochDeterminesMembership
