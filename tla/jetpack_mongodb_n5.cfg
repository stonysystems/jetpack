\* n = 5 (sq = 4 < n), two clients, three commands, two keys; long simulation runs.
SPECIFICATION Spec
CONSTANTS
  Server = {s1, s2, s3, s4, s5}
  Client = {c1, c2}
  CmdId = {id1, id2, id3}
  Key = {k1, k2}
  MaxElections = 2
  MaxRestarts = 1
  MaxReconfigs = 0
CONSTRAINT N5StateConstraint
INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  NoLogDivergence
  MaxOneReconfigurationAtATime
  ElectionSafety
  Principle2MongoDb
  EpochDeterminesMembership
