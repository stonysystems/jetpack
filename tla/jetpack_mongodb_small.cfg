\* Small config for jetpack_mongodb_composition (the pseudocode): 3 servers, one election,
\* no reconfiguration. Exhaustive in minutes.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  MaxElections = 1
  MaxRestarts = 0
  MaxReconfigs = 0

CONSTRAINT SmallStateConstraint

INVARIANTS
  CommittedLogAgreement
  LogOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  RecoveredAgreement
  FastCommitDurability
  PoolsConflictFree
  NoLogDivergence
  MaxOneReconfigurationAtATime
  ElectionSafety
  Principle2MongoDb
  EpochDeterminesMembership
