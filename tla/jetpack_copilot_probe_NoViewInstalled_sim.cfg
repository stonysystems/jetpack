\* Probe for TLC simulation mode (random traces, no state constraint):
\*   java -cp tla2tools.jar tlc2.TLC -simulate -depth 120 \
\*        -config jetpack_copilot_probe_NoViewInstalled_sim.cfg jetpack_copilot_composition.tla
\* Probe_NoViewInstalled is EXPECTED to be violated: the trace is a completed
\* recovery (Recovered(S) committed, FinishRecovery delivered, a replica's
\* last normal view advanced). Same constants as jetpack_copilot_small.cfg.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1}
  Key = {k1}
  MaxPilotChanges = 1
  MaxRestarts = 0

INVARIANT Probe_NoViewInstalled
