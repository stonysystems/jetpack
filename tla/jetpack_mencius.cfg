\* Default config for jetpack_mencius_composition (the pseudocode): 3 servers (one static
\* view, every server a proposer), two commands on two keys, one restart and
\* one revoke. No SYMMETRY: base_mencius's round-robin order is a CHOOSE over
\* Server, which is not symmetric.
SPECIFICATION Spec

CONSTANTS
  Server = {s1, s2, s3}
  Client = {c1}
  CmdId = {id1, id2}
  Key = {k1, k2}
  MaxRestarts = 1
  MaxRevokes = 1

CONSTRAINT StateConstraint

INVARIANTS
  CommittedLogAgreement
  SlotOrderMatchesExecution
  ExecutionDedupMatches
  ReplicaInvariants
  FastCommitDurability
  PoolsConflictFree
  SlotAgreement
  LogMatchesSlots
  StaticView
